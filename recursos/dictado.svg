<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Dictado</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1F2B"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#E879F9"/>
    </linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#fondo)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#22D3EE" stroke-opacity="0.18" stroke-width="3"/>
  <g filter="url(#brillo)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- micrófono -->
    <rect x="206" y="104" width="100" height="176" rx="50" stroke="#22D3EE" stroke-width="22"/>
    <path d="M166 236 v14 a90 90 0 0 0 180 0 v-14" stroke="url(#neon)" stroke-width="22"/>
    <path d="M256 340 v52 M214 400 h84" stroke="url(#neon)" stroke-width="22"/>
    <!-- ondas de voz -->
    <path d="M116 200 v64 M80 216 v32" stroke="#E879F9" stroke-width="18"/>
    <path d="M396 200 v64 M432 216 v32" stroke="#E879F9" stroke-width="18"/>
  </g>
</svg>
